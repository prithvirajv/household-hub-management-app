<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Reports Category report card: a horizontal bar with an icon and dollar amount per category, sorted largest first">
  <rect width="640" height="280" rx="14" fill="#eef3f7"/>
  <rect x="20" y="20" width="600" height="240" rx="10" fill="#ffffff" stroke="#dfe7ef"/>
  <text x="46" y="48" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#1d2945">Category report</text>

  <text x="46" y="82" font-family="Inter, sans-serif" font-size="16">🏠</text>
  <text x="70" y="82" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#111827">Housing</text>
  <rect x="170" y="72" width="360" height="16" rx="8" fill="#e5eee9"/>
  <rect x="170" y="72" width="330" height="16" rx="8" fill="#3569d4"/>
  <text x="580" y="84" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#111827" text-anchor="end">$3,600</text>

  <text x="46" y="122" font-family="Inter, sans-serif" font-size="16">🛒</text>
  <text x="70" y="122" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#111827">Food</text>
  <rect x="170" y="112" width="360" height="16" rx="8" fill="#e5eee9"/>
  <rect x="170" y="112" width="120" height="16" rx="8" fill="#13936d"/>
  <text x="580" y="124" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#111827" text-anchor="end">$370</text>

  <text x="46" y="162" font-family="Inter, sans-serif" font-size="16">🚗</text>
  <text x="70" y="162" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#111827">Transportation</text>
  <rect x="170" y="152" width="360" height="16" rx="8" fill="#e5eee9"/>
  <rect x="170" y="152" width="60" height="16" rx="8" fill="#e05252"/>
  <text x="580" y="164" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#111827" text-anchor="end">$90</text>

  <text x="46" y="202" font-family="Inter, sans-serif" font-size="16">🎁</text>
  <text x="70" y="202" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#111827">Giving</text>
  <rect x="170" y="192" width="360" height="16" rx="8" fill="#e5eee9"/>
  <rect x="170" y="192" width="14" height="16" rx="7" fill="#d99a24"/>
