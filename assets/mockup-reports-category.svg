  <text x="46" y="242" font-family="Inter, sans-serif" font-size="16">💳</text>
  <text x="70" y="242" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#111827">Debt</text>
  <rect x="170" y="232" width="360" height="16" rx="8" fill="#e5eee9"/>
  <rect x="170" y="232" width="14" height="16" rx="7" fill="#e05252"/>
  <text x="580" y="244" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#111827" text-anchor="end">$0</text>
