apiVersion: v1
kind: Secret
metadata:
  name: household-hub-secrets
  namespace: household-hub
type: Opaque
stringData:
  DATABASE_URL: postgres://user:password@host:5432/household_hub
  SESSION_SECRET: replace-with-a-long-random-secret
  ADMIN_EMAIL: owner@example.com
  ADMIN_PASSWORD: replace-with-a-private-12-character-password
  ADMIN_NAME: Household Hub Administrator
  DATABASE_SSL: "true"
  APP_BASE_URL: https://householdhub.example.com
  EMAIL_FROM: Household Hub <no-reply@householdhub.example.com>
  SMTP_HOST: smtp.example.com
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  SMTP_USER: smtp-user
  SMTP_PASS: replace-with-smtp-password
